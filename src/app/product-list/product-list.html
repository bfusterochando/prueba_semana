<div>
  <div style="background-color: blue; color: white; padding: 0.75rem">My product's list</div>
  <div style="padding: 1rem">
    <div *ngIf="products && products.length">
      <table style="width: 100%">
        <thead>
          <tr style="background-color: lightgrey; text-align: center">
            <th>{{ headers.image }}</th>
            <th>{{ headers.desc }}</th>
            <th>{{ headers.price }}</th>
            <th>{{ headers.avail }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let product of products">
            <td><img [src]="product.imageUrl" alt="" /></td>
            <td>{{ product.desc }}</td>
            <td>{{ product.price }}</td>
            <td>{{ product.avail }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
